              maps_1p_jar: Google Maps-en erabilera/lehentasunak eta iragarkien pertsonalizazio-seinaleak gordetzen ditu.
              maps_consent: Mapen txertaketak erabiltzean Google zerbitzuetarako parte-hartzailearen baimen-egoera gordetzen du.
              maps_nid: Google Maps-en hobespenak eta segurtasunarekin lotutako nabigatzailearen informazioa gordetzen ditu.
              matomo_mtm_consent: Matomo-ren jarraipenerako parte-hartzailearen baimen-egoera gordetzen du.
              matomo_pk_id: Bisitariaren ID bakarra gordetzeko eta berriz itzultzen diren bisitariak identifikatzeko erabilia.
              matomo_pk_ref: Jatorriari buruzko informazioa (erabiltzailea webgunera ekarri duen erreferentzia-iturria) gordetzeko erabilia.
              matomo_pk_ses: Uneko bisitarako aldi baterako saioaren datuak gordetzeko erabilia.
              osm_location: Stores map location/zoom defaults for OpenStreetMap interactions.
              osm_session: Aldi baterako saioko datuak gordetzen ditu OpenStreetMap-eko erabiltzaileen interakzioetarako.
              osm_totp_token: OpenStreetMap kontuko lan-fluxuetarako 2FArekin lotutako token-datuak aldi baterako gordetzen ditu.
              pref: Funtzionaltasunerako erabiltzen da. YouTube-k cookie hau erabiltzen du, besteak beste, orriaren konfigurazio gogokoena eta erreprodukzio-hobespenak gordetzeko, hala nola erreprodukzio automatikoaren aukera esplizituak, edukia ausazko ordenan erreproduzitzea eta erreproduzitzailearen tamaina. Irakurri gehiago "Googlek cookieak nola erabiltzen dituen" atalean
              recaptcha_grecaptcha: reCAPTCHA-k spamaren aurkako babesa eta arrisku-analisia eskaintzeko erabiltzen du.
              recaptcha_rc_a: reCAPTCHA-ren arrisku-analisiaren metadatuak arakatzailearen biltegian gordetzen ditu.
              recaptcha_rc_c: reCAPTCHA-ren erronka/saioaren metadatuak arakatzailearen biltegian gordetzen ditu.
              remember_user_token: Saioa hastean "Gogoratu nazazu" aukeran klik egiten baduzu, saioa irekita mantentzea ahalbidetzen du.
              session_id: Webguneei parte-hartzailea gogoratzeko aukera ematen die webgune bereko orri batetik bestera mugitzen denean.
              turnstile_cf_bm: Cloudflare-k trafiko automatizatua detektatzen eta arintzen laguntzeko erabiltzen du.
              turnstile_cf_clearance: Bisitari batek aurreko segurtasun-erronka bat gainditu duela egiaztatzen duen froga gordetzen du.
              turnstile_cfuvid: Cloudflare-k IP helbide bera partekatzen duten parte-hartzaileak bereizten laguntzen du.
              vimeo_player: Vimeo erreproduzitzailearen hobespenak gordetzen ditu, hala nola bolumena, kalitatea edo erreprodukzio automatikoaren portaera.
              vimeo_vuid: Analitikarako erabiltzen den Vimeo bisitari-identifikatzaile bakarra gordetzen du.
              visitor_info1_live: Funtzionaltasunerako, analitikarako, publizitaterako eta pertsonalizaziorako erabiltzen da. Informazio gehiago Google-k cookieak nola erabiltzen dituen atalean
              ysc: Segurtasunerako erabiltzen da. Parte-hartzailearen nabigazio-saioak irauten duen bitartean irauten du. Nabigazio-saio baten barruko eskaerak parte-hartzaileak berak egiten dituela, eta ez beste webgune batzuek, bermatzeko erabiltzen da. Cookie honek webgune gaiztoek parte-hartzailearen izenean, hark jakin gabe, jardutea eragozten du. Irakurri gehiago "Google-k cookieak nola erabiltzen dituen" atalean
              yt_remote_connected_devices: YouTube erreproduzitzailea kontrolatzeko konektatutako gailuen zerrenda gordetzen du.
              yt_remote_device_id: YouTube erreproduzitzailearen urruneko interakzioetarako gailu-identifikatzaile bat gordetzen du.
              ytidb_last_result_entry_key: YouTube erreproduzitzailearen azken emaitzaren metadatuak tokiko biltegian gordetzen ditu.
            explanations:
              cloudflare_turnstile: |-
                Gehitu cookie hauek Cloudflare Turnstile gaituta dagoenean, formularioak erabilera desegokitik eta trafiko automatizatutik babesteko. Botak detektatzen, saioak baliozkotzen eta erronken jarraitutasuna bermatzen laguntzen dute. 
                Gomendatutako kategoria: Ezinbestekoa
              decidim_essential: |-
                Gehitu Decidim plataformaren oinarrizko funtzionamendurako beharrezkoak diren funtsezko cookie hauek. Cookie hauek parte-hartzaileen autentifikazioa, saioen kudeaketa eta baimenaren jarraipena ahalbidetzen dute.

                Gomendatutako kategoria: Funtsezkoak
              emoji_picker: |-
                Gehitu cookie hau testu-editoreetan emoji-hautatzailearen funtzioa gaitzen duzunean. Duela gutxi erabilitako emojiak gordetzen ditu parte-hartzailearen esperientzia pertsonalizatzeko. 
                Gomendatutako kategoria: Hobespenak
              facebook_pixel: |-
                Gehitu cookie hauek Meta (Facebook) Pixel erabiltzen duzunean bihurketen jarraipena edo iragarkien atribuzioa egiteko. Nabigatzaile-saioak identifikatzen eta kanpainen errendimendua neurtzen laguntzen dute. 
                Gomendatutako kategoria: Marketina
              google_analytics: |-
                Gehitu cookie hauek Google Analytics (GA4/gtag.js) erabiltzen duzunean trafikoa eta parte-hartzaileen portaera neurtzeko. Bisitariak identifikatzen, saioak bereizten eta erabilera-estatistikak sortzen laguntzen dute. 
                Gomendatutako kategoria: Analitika
              google_maps_embeds: |-
                Gehitu cookie hauek zure orrietan Google Maps txertatzen duzunean (adibidez, mapa-widgetak edo kokapen-blokeak). Mapa-hobespenak, baimenaren egoera eta erabilera-metrikak kudeatzen laguntzen dute.

                Gomendatutako kategoria: Lehentasunak edo Analitika
              google_tag_manager: |-
                Gehitu cookie hauek zure analitika- edo marketin-etiketak Google Tag Manager bidez hornitzen direnean. Etiketa batzuek jarraipen-cookie gehigarriak ezar ditzakete GTM konfigurazioaren arabera.

                Gomendatutako kategoria: Analitika edo Marketina
              graphiql: |-
                Gehitu cookie hauek garatzaileentzako GraphQL APIaren arakatzailea (/api/graphiql) gaitzen duzunean. Arakatzailearen interfazearen hobespenak, kontsulten historia eta fitxen konfigurazioak gordetzen dituzte. 
                Gomendatutako kategoria: Hobespenak
              hcaptcha: |-
                Gehitu cookie/biltegiratze-sarrera hauek hCaptcha formularioetan gaituta dagoenean. Botak detektatzeko, irisgarritasun-aukeretarako eta erronken/saioen kudeaketarako erabiltzen dira. 
                Gomendatutako kategoria: Ezinbestekoa
              jitsi_meet: |-
                Gehitu cookie hauek Jitsi Meet bideokonferentziako topaketak zure plataforman integratzen dituzunean. Parte-hartzaileen ezarpenak, hizkuntza-hobespenak, bideo-kalitatearen aukerak eta bideokonferentzia-zerbitzuko saio-datuak gordetzen dituzte. 
                Gomendatutako kategoria: Hobespenak
              linkedin_insight: |-
                Gehitu cookie hauek LinkedIn Insight Tag erabiltzen duzunean, kanpainen errendimendua eta LinkedIn iragarkietatik datozen bisitarien bihurketak neurtzeko. 

                Gomendatutako kategoria: Marketina
              matomo: |-
                Gehitu cookie hauek Matomo analitika erabiltzen duzunean webgunearen estatistikak biltzeko. Bisitari errepikariak identifikatzen, saioen jarraipena egiten eta txosten agregatuetarako erabiltzen den erreferentzia-informazioa gordetzen laguntzen dute. 
                Gomendatutako kategoria: Analitika
              openstreetmap_tiles: |-
                Gehitu cookie hauek zure mapa-esperientziak cookieak ezar ditzaketen OpenStreetMap-en ostatatutako baliabideak erabiltzen dituenean (adibidez, txertatutako mapak edo OSM kontuari lotutako funtzioak).

                Gomendatutako kategoria: Hobespenak
              recaptcha: |-
                Gehitu cookie/biltegiratze-sarrera hauek Google reCAPTCHA-k formularioak erabilera desegokitik eta botetatik babesten dituenean. Parte-hartzaileen interakzioak eta segurtasun-seinaleak ebaluatzen laguntzen dute. 
                Gomendatutako kategoria: Ezinbestekoa
              vimeo_embeds: |-
                Gehitu cookie hauek Vimeo bideoak orrietan, proposamenetan edo iruzkinetan txertatzen dituzunean. Vimeo-k cookie horiek erabil ditzake erreproduzitzailearen ezarpenak gogoratzeko eta erreprodukzio-interakzioak neurtzeko. 
                Gomendatutako kategoria: Hobespenak edo Analitika
              youtube_embeds: |-
                Gehitu cookie hauek edukietan YouTube bideoak txertatzea baimentzen duzunean (proposamenak, iruzkinak, etab.). YouTube-k analitika- eta jarraipen-cookieak ezartzen ditu, bideoen erreprodukzioari eta parte-hartzaileen portaerari buruzko informazioa biltzeko.

                Gomendatutako kategoria: Lehentasunak (bideoak edukiaren osagai integralak badira), Analitika (jarraipena/estatistikak egiteko) edo Marketina (publizitate-helburuetarako erabiltzen bada)
              youtube_nocookie: |-
                Gehitu biltegiratze-gako hauek YouTube-ren pribatutasun hobetuko modua (youtube-nocookie.com) erabiltzen duzunean. Erreproduzitzailearen egoera eta gailu/saio hobespenak gordetzeko erabiltzen dira. 

                Gomendatutako kategoria: Hobespenak
